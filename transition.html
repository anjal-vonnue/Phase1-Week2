<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transitions</title>
    <link rel="stylesheet" href="transition.css" />
  </head>
  <body>
    <h1>FIVE TIMING FUNCTIONS</h1>
    <section class="timing-functions">
      <h2>Linear</h2>
      <div class="linear-ani"></div>
      <h2>Ease</h2>
      <div class="ease-ani"></div>
      <h2>Ease-In</h2>
      <div class="ease-in-ani"></div>
      <h2>Ease-Out</h2>
      <div class="ease-out-ani"></div>
      <h2>Ease-In-Out</h2>
      <div class="ease-in-out-ani"></div>
    </section>
    <h1>BOUNCE TRANSITION</h1>
    <button class="btn">Submit</button>
    <h1>CARD DELAY</h1>
    <div class="card">
      <h2 class="hide">TITILE</h2>
      <p class="hide delay-50">
        Lorem ipsum dolor, sit amet consectetur adipisicing elit. Eveniet nemo
        fugit impedit ex vitae delectus, nisi doloremque ad illum nam?
      </p>
      <button class="card-button hide delay-100">Enter</button>
    </div>
    <h1>Focus state</h1>
    <label for="name">Name: </label>
    <input id="name" type="text" />
  </body>
</html>
