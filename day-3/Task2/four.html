<!doctype html>
<html lang="en-US">
  <head>
    <title>Line Based Placement and Spanning</title>
    <meta charset="utf-8" />
    <meta
      name="description"
      content="explicit grid and place eight items manually using grid-colummns"
    />
    <link rel="stylesheet" href="four.css" />
  </head>
  <body>
    <main>
      <div class="grid-container">
        <div class="item1">item 1: grid-column: 1/3;</div>
        <div class="item2">item 2: grid-column: span 2</div>
        <div class="item3">item 3: grid-row: 2/4</div>
        <div class="item4">Item 4: grid-column: span 2</div>
        <div class="item5">Item 5: grid-column: span 2</div>
        <div class="item6">Item 6: grid-column: 1/-1</div>
        <div class="item7">Item 7: auto flow dense</div>
        <div class="item8">Item 8: auto flow dense</div>
      </div>
    </main>
  </body>
</html>
