<!doctype html>
<html>
  <head>
    <title>Every Item Property</title>
    <meta charset="utf-8" />
    <meta name="description" content="every item Property" />
    <link rel="stylesheet" href="item.css" />
  </head>
  <body>
    <main>
      <h1>Every Item Propery</h1>
      <h2>flex grow</h2>
      <div class="container">
        <div class="box grow-1">1</div>
        <div class="box grow-2">2</div>
        <div class="box grow-3">3</div>
        <div class="box grow-4">4</div>
        <div class="box grow-5">5</div>
      </div>
      <h2>flex shrink</h2>
      <div class="container shrink-width">
        <div class="box sh-1">1</div>
        <div class="box sh-2">2</div>
        <div class="box sh-3">3</div>
        <div class="box sh-4">4</div>
        <div class="box sh-5">5</div>
      </div>
      <h2>flex basis</h2>
      <div class="container basis">
        <div class="box zero">1</div>
        <div class="box auto">2</div>
        <div class="box pixel">3</div>
        <div class="box per">4</div>
      </div>
      <h2>Order Property</h2>
      <div class="container">
        <div class="box size item1">1</div>
        <div class="box size item2">2</div>
        <div class="box size item3">3</div>
        <div class="box size item4">4</div>
        <div class="box size item5">5</div>
      </div>
      <h2>Align Self</h2>
      <div class="container stretch">
        <div class="box width">1</div>
        <div class="box width">2</div>
        <div class="box center width">3</div>
        <div class="box width">4</div>
        <div class="box width">5</div>
      </div>
    </main>
  </body>
</html>
