<!doctype html>
<html lang="en-US">
  <head>
    <title>Pseudo Classes And Pseudo Elements</title>
    <meta charset="utf-8" />
    <meta name="description" content="pseudo classes and pseudo elements" />
    <link rel="stylesheet" href="pseudo.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Pseudo-Classes & Pseudo-Elements</h1>
      </header>

      <nav>
        <a href="#">Home</a>
        <a href="#about">About Us</a>
        <a href="#values">Our Values</a>
        <a href="#products">Products</a>
        <a href="Contact">Contact</a>
      </nav>

      <main>
        <h2>Custom Styled Checkbox</h2>
        <p>
          <input type="checkbox" id="check" />
          <label class="label" for="check">Subscribe to Our Newsletter</label>
        </p>
        <h2>List Using CSS Counter</h2>
        <ol>
          <li>Iron-Man</li>
          <li>Thor</li>
          <li>BatMan</li>
          <li>SpiderMan</li>
          <li>Minnal Murali</li>
          <li>Dinkan</li>
        </ol>
        <h2>Tooltip</h2>
        <p class="tooltip" data-tooltip="this is a tooltip">hover over Here</p>
      </main>
    </main>
  </body>
</html>
